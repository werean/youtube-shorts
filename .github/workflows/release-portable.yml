name: Build & Release Portable Windows App

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semver override (e.g. 0.1.50; defaults to 0.1.<run_number>)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Portable Win64 Release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and build frontend
        run: |
          bun install
          Push-Location frontend
          try {
            bun install
            bun run build
          } finally {
            Pop-Location
          }

      - name: Setup Python 3.12 for backend verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run quick backend unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115.0" "uvicorn[standard]>=0.30.0" "pydantic>=2.8.0" "python-multipart>=0.0.9" "httpx>=0.27.0" "numpy>=1.26.0" "scipy>=1.13.0" "pytest>=8.2.0" "pytest-asyncio>=0.23.8"
          Push-Location backend
          try {
            python -m pytest tests/test_phase1_foundation.py tests/test_dependency_installers.py -p no:cacheprovider -v
          } finally {
            Pop-Location
          }

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Compute release version and sync desktop manifests
        run: |
          $inputVersion = "${{ inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            $version = "0.1.${{ github.run_number }}"
          } else {
            $version = $inputVersion -replace '^v', ''
          }
          $tag = "v$version"

          Write-Output "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          # Update [package] version in desktop/Cargo.toml without touching dependency versions
          $cargoPath = "desktop/Cargo.toml"
          $cargoText = [System.IO.File]::ReadAllText($cargoPath)
          $updatedCargo = [regex]::Replace(
            $cargoText,
            '(?ms)(^\[package\].*?^\s*version\s*=\s*")[^"]+(")',
            "`${1}$version`${2}",
            1
          )
          if ($updatedCargo -eq $cargoText -and $cargoText -notmatch "(?ms)^\[package\].*?^\s*version\s*=\s*`"$([regex]::Escape($version))`"") {
            throw "Failed to update [package] version in $cargoPath"
          }
          [System.IO.File]::WriteAllText($cargoPath, $updatedCargo, $utf8NoBom)

          # Update top-level version in desktop/tauri.conf.json
          $tauriPath = "desktop/tauri.conf.json"
          $tauriJson = Get-Content -LiteralPath $tauriPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $tauriJson.version = $version
          $updatedTauri = ($tauriJson | ConvertTo-Json -Depth 20) -replace "`r`n", "`n"
          [System.IO.File]::WriteAllText($tauriPath, "$updatedTauri`n", $utf8NoBom)

          Write-Output "Configured build version $version ($tag)"

      - name: Run desktop unit tests
        run: cargo test --manifest-path desktop/Cargo.toml

      - name: Build desktop release binary
        run: cargo build --release --manifest-path desktop/Cargo.toml

      - name: Package portable Windows executable
        run: pwsh -File scripts/package-portable.ps1 -Version "$env:RELEASE_VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: YouTube Shorts ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-portable/youtube-shorts.exe
